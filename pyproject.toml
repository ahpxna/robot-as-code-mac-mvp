[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-as-code-mac-mvp"
version = "0.2.0"
description = "Robot-as-Code: robots, worlds and missions defined as code, simulated in MuJoCo on macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
# Learned open-vocabulary object detector (OWLv2): --detector learned. Weights (~600 MB) download on first use.
vision = ["torch>=2.2", "transformers>=4.45"]

[project.scripts]
robot-mvp = "robotcode.cli:main"
robot-eval = "robotcode.evaluate:main"
robot-perception-bench = "robotcode.perception_bench:main"

[tool.setuptools.packages.find]
where = ["src"]
